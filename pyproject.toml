[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "refit"
version = "0.1.0"
description = "Measured adaptation and repair of everyday objects"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1", "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "Pillow>=11,<13", "reportlab>=4,<5", "python-multipart>=0.0.18,<1", "httpx>=0.27,<1", "pypdfium2>=4,<6"]

[project.optional-dependencies]
cad = ["cadquery>=2.6,<3", "trimesh>=4.5,<5"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pypdfium2>=4,<6", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
